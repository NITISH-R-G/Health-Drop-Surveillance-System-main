name: Repository Automation

on:
  push:
    branches: [ main ]
  release:
    types: [published]
  schedule:
    - cron: '0 0 * * 0' # Run weekly on Sunday at midnight

permissions:
  contents: write

jobs:
  auto-document:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18.x
        cache: 'npm'

    - name: Install system dependencies for diagrams
      run: sudo apt-get update && sudo apt-get install -y graphviz

    - name: Install Node Dependencies
      run: npm ci --legacy-peer-deps

    - name: Run automated documentation generation
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: npm run docs:auto

    - name: Commit and Push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add README.md .automation/
        git commit -m "docs(auto): update repository architecture, graphs, and README [skip ci]" || echo "No changes to commit"
        git push
